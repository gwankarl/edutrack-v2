name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality and build checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edutrack_test
          POSTGRES_USER: edutrack_test
          POSTGRES_PASSWORD: edutrack_ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edutrack_test -d edutrack_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build shared contracts
        run: npm run build --workspace=@edutrack/contracts

      - name: Run unit, component, contract, and API tests
        run: npm run test:unit

      - name: Run PostgreSQL integration tests
        run: npm run test:db
        env:
          DATABASE_TEST_URL: postgresql://edutrack_test:edutrack_ci_only_password@localhost:5432/edutrack_test

      - name: Build frontend
        run: npm run build --workspace=@edutrack/frontend
